name: ✨ Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Discover KW even better? Lay it out below.

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Content Calendar
        - Business CRM
        - Media Kit Generator
        - Analytics Tracker
        - Caption Library
        - Navigation / Layout
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or gap in the current experience.
      placeholder: "I have to manually copy hashtags one at a time..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe your ideal solution
      placeholder: "A 'Copy All' button that copies all hashtag sets for a pillar at once."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, or any other details.
